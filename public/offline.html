<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Accountrix Plus</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <!--
      Plain HTML with inline styles, and not a page in the app.

      This is the one document that has to render when nothing else can, so it
      cannot depend on the framework: a Next.js page ships a JavaScript chunk,
      and a chunk the person never downloaded is not in the cache when they go
      offline. The first version of this file was a React page, and navigating
      offline produced "Application error: a client-side exception has
      occurred" — the framework failing to load its own error page.

      No script, no stylesheet, no font. Everything it needs is in these bytes.

      Which is why the colours below are written out. They are a copy of the
      five tokens this page uses from `src/app/globals.css`, and
      `tests/palette.test.ts` fails if they drift from it — because they had
      drifted: until Phase 79 this whole block was the teal palette the
      application stopped using at Phase 70. A page nobody sees until their
      signal drops is a page nobody looks at.

      `--surface` and `--line` were declared here and used by nothing. Gone: a
      value nothing reads is a value nothing can notice going stale.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #fafbfc;
        --ink: #0d1117;
        --muted: #5b6672;
        --action: #1f5fd9;
        --action-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0d1117;
          --ink: #f4f6f8;
          --muted: #a8b1bd;
          --action: #6096ff;
          --action-ink: #080e1a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: var(--canvas);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 22rem; width: 100%; text-align: center; }
      h1 { margin: 0 0 0.75rem; font-size: 1.125rem; }
      p { margin: 0 0 0.75rem; font-size: 0.875rem; color: var(--muted); }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        width: 100%;
        margin-top: 1.5rem;
        padding: 0 1rem;
        border-radius: 0.5rem;
        /*
          The action blue, not the lime. The lime is the design's one loud
          colour and it is used on the dark chrome; this button sits on the
          light canvas, where a primary action is `.btn-primary` — which is
          `bg-action text-action-ink`, the same two tokens.
        */
        background: var(--action);
        color: var(--action-ink);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        display: block;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>This page has not been opened on this device yet, so there is nothing saved to show you.</p>
      <p>
        Anything you have already reviewed is saved on this phone and will be sent as soon as you
        have a signal. Nothing is lost.
      </p>
      <a href="/m">Back to the app</a>
    </main>
  </body>
</html>
